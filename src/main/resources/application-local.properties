mytestkey=This value is from LOCAL properties file



# Redis configuration for local development.
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Keep blank when local Redis has no auth; set real value if requirepass is enabled.
spring.data.redis.password=


# Spring Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/validations?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=validations
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=validations
spring.flyway.url=jdbc:mysql://localhost:3306/validations?createDatabaseIfNotExist=true
spring.flyway.user=root
spring.flyway.password=root!
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.springframework=INFO
